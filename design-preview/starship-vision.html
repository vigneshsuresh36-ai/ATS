const pages=[['overview','▦','Dashboard'],['jobs','▤','Requisitions'],['pipeline','▥','Candidate pipeline'],['schedule','◷','Interview'],['approvals','✓','Approvals'],['offers','◇','Offer & joining'],['pool','◎','Talent pool'],['referrals','♧','Referrals'],['reports','⇩','Reports'],['ai','✳','AI workspace'],['settings','⚙','Settings']];let current='overview';const nav=document.getElementById('nav'),screen=document.getElementById('screen'),mobile=document.getElementById('mobile');nav.innerHTML=pages.map(([id,icon,label])=>'<button class="nav" data-page="'+id+'"><span>'+icon+'</span>'+label+'</button>').join('');mobile.innerHTML=pages.map(([id,icon,label])=>'<option value="'+id+'">'+label+'</option>').join('');function heading(title,sub,action){return '<div class="heading"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+(action?'<button class="btn" data-demo>'+action+'</button>':'')+'</div>'}function rows(items){return items.map(x=>'<div class="row"><div><b>'+x[0]+'</b><p>'+x[1]+'</p></div><span class="tag '+(x[3]||'')+'">'+x[2]+'</span></div>').join('')}function aiCard(title,body){return '<div class="card ai"><span class="aiicon">✳</span><h2>'+title+'</h2><p>'+body+'</p><div class="recommend"><b>Always in your control</b><p>See the source, review the suggestion, and approve actions before anything is sent or changed.</p><button class="link" data-page="ai">Explore AI workspace →</button></div><div class="footnote">Proposed feature · Human review required</div></div>'}function metrics(items){return '<div class="grid">'+items.map(x=>'<div class="card metric"><span class="label">'+x[0]+'</span><strong>'+x[1]+'</strong><small>'+x[2]+'</small></div>').join('')+'</div>'}function table(headers,data){return '<div class="card tablewrap"><table class="table"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+r.map((x,i)=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function render(){document.querySelectorAll('. follow-up.')+'</div>';break;case'jobs':s=heading('Requisitions','Track every role from request to hire.','＋ New requisition')+'<div class="tabs"><button class="chip active">All roles · 12</button><button class="chip" data-demo>Awaiting approval · 3</button><button class="chip" data-demo>Active · 8</button><button class="chip" data-demo>Closed · 1</button></div>'+table(['Role / ID','Department','Owner','Candidates','Status'],[['Senior Data Analyst<small>REQ-024 · Bengaluru</small>','Data','Priya Shah','14','<span class="tag">Active</span>'],['Product Designer<small>REQ-023 · Bengaluru</small>','Technology','Maya Rao','8','<span class="tag">Active</span>'],['Operations Lead<small>REQ-022 · Gurgaon</small>','Operations','Rohan Das','—','<span class="tag amber">Pending approval</span>']])+'<div class="notice">AI opportunity: draft a job description from structured requirements; show edits and require approval before publishing.</div>';break;case'pipeline':s=heading('Candidate pipeline','Product Designer · REQ-023 · 8 candidates','＋ Add candidate')+'<div class="tabs"><button class="chip active">Board view</button><button class="chip" data-demo>List view</button><button class="chip" data-demo>All sources</button></div><div class="columns">'+[['New','2','Ananya Sharma','Portfolio received','Arjun Patel','Applied today'],['Screening','2','Diya Mehta','Phone screen pending','Riya Nair','Review feedback'],['Interview','3','Kabir Jain','Round 2 · Thu','Sara Khan','Feedback due'],['Offer','1','Nikhil Rao','Approval requested','','']].map(c=>'<div class="column"><h3>'+c[0]+' <span class="sub">'+c[1]+'</span></h3><div class="candidate" tabindex="0" role="button" aria-label="Open sample candidate"><b>'+c[2]+'</b><p>'+c[3]+'</p></div>'+(c[4]?'<div class="candidate" tabindex="0" role="button" aria-label="Open sample candidate"><b>'+c[4]+'</b><p>'+c[5]+'</p></div>':'')+'</div>').join('')+'</div><div class="notice">AI opportunity: summarize evidence against job requirements with citations. People decide advancement; no automatic rejection or opaque suitability score.</div>';break;case'schedule':s=heading('Interviews','Coordinate interviews, feedback, and follow-ups.','＋ Schedule interview')+'<div class="split"><div class="card"><div class="cardhead"><h2>Upcoming interviews</h2><span class="tag">This week</span></div>'+rows([['Product Designer · Kabir Jain','Thursday, 10:30 AM · Design round','Confirmed'],['Data Analyst · Ananya Sharma','Friday, 2:00 PM · Hiring manager','Awaiting reply','amber'],['Operations Lead · Sara Khan','Friday, 4:00 PM · Panel','Confirmed']])+'</div>'+aiCard('Scheduling assistant','Suggest mutual availability and prepare invites. A team member reviews recipients and confirms before sending.')+'</div>';break;case'approvals':s=heading('Approvals','Make clear, informed decisions with the context you need.')+'<div class="tabs"><button class="chip active">Requisitions · 3</button><button class="chip" data-demo>Offers · 2</button></div><div class="split"><div class="card"><h2>Awaiting your review</h2>'+rows([['Operations Lead','Operations · Requested by Rohan Das','2 days','amber'],['Senior Data Analyst','Data · Requested by Priya Shah','Today'],['Customer Success Manager','Sales · Requested by Neha Roy','Today']])+'</div>'+aiCard('Approval brief','Summarize the request, budget and outstanding questions with links to the underlying records.')+'</div>';break;case'offers':s=heading('Offer & joining','Keep each accepted offer moving toward a successful start.')+metrics([['Offers in progress','6','2 awaiting approval'],['Joining this month','4','1 date changed'],['Awaiting confirmation','2','Follow-up needed'],['Joined','9','This quarter']])+'<div class="split"><div class="card"><h2>Joining tracker</h2>'+rows([['Nikhil Rao · Product Designer','Joining 18 Nov · Recruiter Maya','Confirmed'],['Kavya Singh · Data Analyst','Joining 25 Nov · Confirmation needed','Follow up','amber']])+'</div>'+aiCard('Joining assistant','Draft follow-ups and highlight overdue tasks. Changes to dates, offers and status stay with your team.')+'</div>';break;case'pool':s=heading('Talent pool','Rediscover candidates with relevant experience and consent.','＋ Add candidate')+table(['Candidate','Experience','Skills','Last activity'],[['Aditi Menon','6 years','Product design, research','3 months ago'],['Vikram Shah','4 years','Analytics, SQL','5 months ago'],['Meera Kapoor','8 years','Operations, logistics','2 months ago']])+'<div class="notice">AI opportunity: search by skills and experience, show supporting source text and check consent or retention status before outreach.</div>';break;case'referrals':s=heading('Employee referrals','Help great people find their next opportunity.','Browse open roles')+'<div class="placeholder"><div class="card"><h2>Roles open for referrals</h2>'+rows([['Product Designer','Technology · Bengaluru','Open'],['Data Analyst','Data · Bengaluru','Open'],['Operations Lead','Operations · Gurgaon','Open']])+'</div>'+aiCard('Referral helper','Explain a role and draft a referral message for an employee to review. Never submit on their behalf without confirmation.')+'</div>';break;case'reports':s=heading('Reports & spend','Understand your hiring process and recruitment investment.')+metrics([['Time to fill','34 days','Median · illustrative'],['Offers accepted','78%','Last quarter'],['Active vendors','6','3 with open invoices'],['Recruitment spend','₹4.2L','Last quarter']])+'<div class="split"><div class="card"><h2>Hiring health</h2>'+rows([['Time to fill','Compare by department and role','View report'],['Funnel conversion','Track stage-level movement','View report'],['Vendor performance','Spend and placements','View report']])+'</div>'+aiCard('Reporting assistant','Explain trends and data limitations, with links to the underlying reports. Avoid unsupported causal claims.')+'</div>';break;case'ai':s=heading('AI workspace','One place to review suggestions, drafts, and agent activity.')+'<div class="placeholder"><div class="card"><h2>Assist your team</h2>'+rows([['Job description draft','Start from the requisition and edit together','Draft'],['Candidate evidence summary','Compare stated requirements with source passages','Review'],['Interview preparation','Generate structured, role-related questions','Prepare'],['Pipeline and report insights','Find bottlenecks and explain the data','Explore']])+'</div><div class="card ai"><span class="aiicon">✳</span><h2>Agentic workflows</h2><p>Coordinate multiple steps while keeping people in control.</p>'+rows([['Scheduling coordinator','Find slots → prepare an invitation → request approval','Approval required'],['Follow-up coordinator','Identify overdue items → prepare a reminder','Approval required'],['Recruiting brief','Gather permitted records → create a sourced summary','Review']])+'<div class="footnote">Concept only: no real model, integrations or autonomous actions.</div></div></div><div class="notice"><b>Trust by design:</b> role-based access, clear sources, review before sending or changing records, audit history, retention controls, and a human decision for hiring outcomes.</div><div class="card" style="margin-top:16px"><div class="cardhead"><div><h2>Activity & approvals</h2><p class="sub">A single place to see what the assistant proposed</p></div><span class="tag">Illustrative</span></div><div class="row"><div><b>Interview invitation draft</b><p>Ready for your review · No invitation has been sent</p></div><span class="tag">Review</span></div><div class="row"><div><b>Feedback reminder</b><p>Suggested for an overdue interview · No action taken</p></div><span class="tag">Review</span></div><div class="row"><div><b>Candidate summary</b><p>Source passages available · Hiring decision stays with you</p></div><span class="tag">View</span></div></div>';break;case'settings':s=heading('Settings & trust','Set up your organization, access, and proposed AI controls.')+'<div class="placeholder"><div class="card"><h2>Organization</h2>'+rows([['Team & roles','Manage access and department membership','Manage'],['Integrations','Firebase, calendar and approved connections','Manage'],['Workflow settings','Approvals, referrals, offers and vendors','Manage']])+'</div><div class="card"><h2>AI governance · proposed</h2>'+rows([['Data permissions','Only use information the user is permitted to access','Controlled'],['Human approval','Required for messages and record changes','On'],['Activity history','Record prompts, sources, actions and approvals','On'],['Retention & providers','Configure retention and approved AI providers','Manage']])+'</div></div>';break}screen.innerHTML=s}function openDrawer(title,body){const layer=document.createElement('div');layer.className='overlay';layer.innerHTML='<section class="drawer" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="drawerhead"><div><span class="eyebrow">STARSHIP · CONCEPT</span><h2>'+title+'</h2></div><button class="close" aria-label="Close">×</button></div>'+body+'<div class="drawerfooter"><button class="btn light close-drawer">Close preview</button></div></section>';document.body.appendChild(layer);layer.querySelector('.close').focus();layer.addEventListener('click',e=>{if(e.target===layer||e.target.closest('.close')||e.target.closest('.close-drawer'))layer.remove()});layer.addEventListener('keydown',e=>{if(e.key==='Escape')layer.remove()})}function candidatePreview(name){openDrawer(name,'<div><span class="avatar">'+name.split(' ').map(x=>x[0]).join('')+'</span><b>Product Designer</b><p style="margin-top:12px">Illustrative candidate profile · Bengaluru · 5 years experience</p></div><div class="drawersection"><h3>At a glance</h3><p>Product design, user research and prototyping. Current stage: interview. Contact details and activity are available to authorised team members.</p></div><div class="drawersection"><h3>✳ AI evidence summary <span class="tag">Proposed</span></h3><div class="insight"><p>Summaries would link each claim to the résumé or interview feedback. Review the original evidence before making a decision.</p><small>Sample only · No AI model is connected</small></div></div><div class="drawersection"><h3>Activity timeline</h3><p>Interview scheduled · Feedback pending · Application received</p></div>')}document.addEventListener('click',e=>{const card=e.target.closest('.candidate');if(card){candidatePreview(card.querySelector('b').textContent);return}const page=e.target.closest('[data-page]');if(page){current=page.dataset.page;render();window.scrollTo(0,0)}else if(e.target.closest('[data-demo]')){const label=e.target.closest('[data-demo]').textContent.trim();openDrawer(label,'<div class="drawersection"><h3>Designed for a focused workflow</h3><p>This preview shows where this action fits in the product. It uses illustrative data and is not connected to the live ATS.</p></div><div class="insight"><b>Proposed enhancement</b><p>Keep the key details visible, offer helpful defaults, and show a clear confirmation before saving or sending.</p></div>');}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('candidate')){e.preventDefault();candidatePreview(e.target.querySelector('b').textContent)}});mobile.addEventListener('change',()=>{current=mobile.value;render()});document.getElementById('role').addEventListener('change',e=>{document.querySelector('.banner').textContent='✳  Interactive concept · Viewing as '+e.target.value+'. Role-specific permissions and screens require implementation; all data is illustrative.'});render();</script></body></html>
